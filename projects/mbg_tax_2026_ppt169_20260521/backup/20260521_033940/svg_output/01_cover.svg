<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2142"/>
      <stop offset="100%" stop-color="#1B3A6B"/>
    </linearGradient>
    <linearGradient id="gold_line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#F0C040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg_grad)"/>

  <!-- Decorative circles -->
  <circle cx="1150" cy="80" r="340" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="1150" cy="80" r="240" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="1150" cy="80" r="140" fill="#FFFFFF" fill-opacity="0.04"/>

  <!-- Left gold accent bar -->
  <rect x="0" y="0" width="6" height="720" fill="#D4A017"/>

  <!-- Top gold line -->
  <rect x="6" y="0" width="1274" height="3" fill="#D4A017" fill-opacity="0.5"/>

  <!-- Bottom gold line -->
  <rect x="6" y="717" width="1274" height="3" fill="#D4A017" fill-opacity="0.5"/>

  <!-- Confidential label chip -->
  <rect x="40" y="105" width="240" height="30" rx="4" fill="#D4A017"/>
  <text x="160" y="125" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F2142">CONFIDENTIAL  |  TAX PLANNING</text>

  <!-- Main title -->
  <text x="40" y="215" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="50" font-weight="800" fill="#FFFFFF">ANALISIS PAJAK &amp;</text>
  <text x="40" y="273" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="50" font-weight="800" fill="#FFFFFF">TAX MANAGEMENT</text>

  <!-- Gold accent underline -->
  <rect x="40" y="288" width="520" height="4" fill="url(#gold_line)"/>

  <!-- Subtitle -->
  <text x="40" y="328" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#A8C4E8">Bisnis SPPG – Program Makan Bergizi Gratis</text>
  <text x="40" y="358" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#6A9FC0">Inventaris Kewajiban Pajak  •  Compliance Calendar  •  Tax Optimization Strategy</text>

  <!-- Thin separator -->
  <line x1="40" y1="390" x2="640" y2="390" stroke="#2C5282" stroke-width="1"/>

  <!-- Metadata row 1 -->
  <text x="40" y="418" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6A9FC0">Sudut Pandang</text>
  <text x="40" y="438" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">CFO / Tax Manager / Investment Analyst</text>

  <!-- Metadata row 2 -->
  <text x="40" y="468" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6A9FC0">Omzet Tahunan</text>
  <text x="40" y="488" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#D4A017">Rp 14,08 Miliar  (3.000 porsi × 313 hari × Rp 15.000)</text>

  <text x="380" y="468" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6A9FC0">Tahun Pajak</text>
  <text x="380" y="488" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">2026</text>

  <!-- Metadata row 3 -->
  <text x="40" y="518" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6A9FC0">CAPEX</text>
  <text x="40" y="538" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Rp 3,5 Miliar</text>

  <text x="380" y="518" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6A9FC0">Karyawan</text>
  <text x="380" y="538" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">47 Orang</text>

  <!-- Date line -->
  <text x="40" y="590" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A6A8A">Tanggal Penyusunan: 20 Mei 2026  |  Cut-off Regulasi: 19 Mei 2026</text>

  <!-- Right side KPI cards -->
  <!-- Card 1: Cash ETR -->
  <rect x="710" y="170" width="260" height="125" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#2C5282" stroke-width="1"/>
  <text x="840" y="208" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6A9FC0">CASH EFFECTIVE TAX RATE</text>
  <text x="840" y="265" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="800" fill="#D4A017">52,2%</text>
  <text x="840" y="285" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A6A8A">vs 22% Statutory</text>

  <!-- Card 2: Total Cash Tax -->
  <rect x="990" y="170" width="260" height="125" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#2C5282" stroke-width="1"/>
  <text x="1120" y="208" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6A9FC0">TOTAL CASH TAX / TAHUN</text>
  <text x="1120" y="258" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Rp 195–245 jt</text>
  <text x="1120" y="285" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A6A8A">Belum termasuk PBJT</text>

  <!-- Card 3: RED FLAG PBJT -->
  <rect x="710" y="315" width="260" height="125" rx="8" fill="#C53030" fill-opacity="0.15" stroke="#C53030" stroke-width="1"/>
  <rect x="710" y="315" width="5" height="125" rx="3" fill="#C53030"/>
  <text x="840" y="352" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#FC8181">RED FLAG: PBJT</text>
  <text x="840" y="400" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="800" fill="#FC8181">Rp 1,4 M</text>
  <text x="840" y="430" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#FC8181">Risiko Eksposur / Tahun</text>

  <!-- Card 4: PPh Badan -->
  <rect x="990" y="315" width="260" height="125" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#2C5282" stroke-width="1"/>
  <text x="1120" y="352" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6A9FC0">PPH BADAN STATUTORY</text>
  <text x="1120" y="400" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">22%</text>
  <text x="1120" y="430" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A6A8A">Tarif Normal (UU HPP)</text>

  <!-- Bottom categories bar -->
  <rect x="710" y="462" width="540" height="52" rx="6" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="980" y="483" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6A9FC0">5 KATEGORI PAJAK</text>
  <text x="980" y="503" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#A8C4E8">PPh Badan  •  Withholding Tax  •  PPN/PBJT  •  Pajak Daerah  •  Bea Meterai</text>

  <!-- Footer -->
  <rect x="0" y="693" width="1280" height="27" fill="#0A1929"/>
  <text x="640" y="710" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#4A6A8A">Analisis Pajak &amp; Tax Management MBG 2026  –  Confidential Tax Planning</text>
  <text x="1250" y="710" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#D4A017">1 / 15</text>
</svg>
