<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="65" fill="#1B3A6B"/>
  <rect x="0" y="65" width="6" height="628" fill="#D4A017"/>

  <!-- Header -->
  <text x="40" y="43" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">PARAMETER DOKUMEN</text>
  <text x="1240" y="43" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#A8C4E8">Analisis Pajak &amp; Tax Management MBG 2026</text>

  <!-- Intro text -->
  <text x="40" y="100" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#4A5568">Dokumen ini disusun untuk mengidentifikasi seluruh jenis pajak SPPG MBG, menganalisis treatment berdasarkan regulasi terkini,</text>
  <text x="40" y="120" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#4A5568">dan menyusun strategi tax management untuk mengoptimalkan beban pajak efektif sambil memastikan kepatuhan penuh.</text>

  <!-- Parameters Table -->
  <!-- Header row -->
  <rect x="40" y="140" width="580" height="36" rx="4" fill="#2C5282"/>
  <text x="170" y="163" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Parameter</text>
  <text x="450" y="163" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Detail</text>

  <!-- Row 1 -->
  <rect x="40" y="176" width="580" height="38" fill="#EEF2F8"/>
  <line x1="40" y1="214" x2="620" y2="214" stroke="#CBD5E0" stroke-width="1"/>
  <text x="50" y="200" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4A5568">Topik</text>
  <text x="240" y="200" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1A202C">Tax Planning &amp; Compliance untuk Mitra SPPG</text>

  <!-- Row 2 -->
  <rect x="40" y="214" width="580" height="38" fill="#FFFFFF"/>
  <line x1="40" y1="252" x2="620" y2="252" stroke="#CBD5E0" stroke-width="1"/>
  <text x="50" y="238" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4A5568">Sudut Pandang</text>
  <text x="240" y="238" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1A202C">CFO / Tax Manager / Investment Analyst</text>

  <!-- Row 3 -->
  <rect x="40" y="252" width="580" height="38" fill="#EEF2F8"/>
  <line x1="40" y1="290" x2="620" y2="290" stroke="#CBD5E0" stroke-width="1"/>
  <text x="50" y="276" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4A5568">Periode Referensi</text>
  <text x="240" y="276" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B3A6B">Tahun Pajak 2026</text>

  <!-- Row 4 -->
  <rect x="40" y="290" width="580" height="38" fill="#FFFFFF"/>
  <line x1="40" y1="328" x2="620" y2="328" stroke="#CBD5E0" stroke-width="1"/>
  <text x="50" y="314" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4A5568">Asumsi Omzet Tahunan</text>
  <text x="240" y="314" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#D4A017">Rp 14,08 miliar (3.000 porsi × 313 hari × Rp 15.000)</text>

  <!-- Row 5 -->
  <rect x="40" y="328" width="580" height="38" fill="#EEF2F8"/>
  <line x1="40" y1="366" x2="620" y2="366" stroke="#CBD5E0" stroke-width="1"/>
  <text x="50" y="352" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4A5568">Asumsi Karyawan</text>
  <text x="240" y="352" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1A202C">47 orang (min wajib Juknis 401.1/2025)</text>

  <!-- Row 6 -->
  <rect x="40" y="366" width="580" height="38" fill="#FFFFFF"/>
  <line x1="40" y1="404" x2="620" y2="404" stroke="#CBD5E0" stroke-width="1"/>
  <text x="50" y="390" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4A5568">Asumsi CAPEX</text>
  <text x="240" y="390" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B3A6B">Rp 3,5 miliar</text>

  <!-- Row 7 -->
  <rect x="40" y="404" width="580" height="38" fill="#EEF2F8"/>
  <line x1="40" y1="442" x2="620" y2="442" stroke="#CBD5E0" stroke-width="1"/>
  <text x="50" y="428" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4A5568">Tanggal Penyusunan</text>
  <text x="240" y="428" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1A202C">20 Mei 2026</text>

  <!-- Table border -->
  <rect x="40" y="140" width="580" height="302" rx="4" fill="none" stroke="#CBD5E0" stroke-width="1"/>
  <!-- Vertical divider -->
  <line x1="230" y1="140" x2="230" y2="442" stroke="#CBD5E0" stroke-width="1"/>

  <!-- Right side: Scope & Approach -->
  <rect x="680" y="140" width="560" height="302" rx="6" fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1"/>
  <rect x="680" y="140" width="560" height="36" rx="4" fill="#2C5282"/>
  <text x="960" y="163" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Ruang Lingkup Analisis</text>

  <!-- Scope items -->
  <rect x="700" y="192" width="6" height="6" rx="1" fill="#D4A017"/>
  <text x="716" y="201" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A202C">Peta lengkap kewajiban pajak SPPG (pre-operasional hingga pelaporan tahunan)</text>

  <rect x="700" y="222" width="6" height="6" rx="1" fill="#D4A017"/>
  <text x="716" y="231" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A202C">Analisis PPh Badan, Withholding Tax (PPh 21/22/23/4(2))</text>

  <rect x="700" y="252" width="6" height="6" rx="1" fill="#D4A017"/>
  <text x="716" y="261" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A202C">PPN vs PBJT — area paling kritis dan ambigu</text>

  <rect x="700" y="282" width="6" height="6" rx="1" fill="#D4A017"/>
  <text x="716" y="291" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A202C">Pajak Daerah: BPHTB, PBB-P2, Pajak Air Tanah, Reklame</text>

  <rect x="700" y="312" width="6" height="6" rx="1" fill="#D4A017"/>
  <text x="716" y="321" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A202C">Strategi tax planning &amp; optimasi (deductible, penyusutan, gross-up)</text>

  <rect x="700" y="342" width="6" height="6" rx="1" fill="#D4A017"/>
  <text x="716" y="351" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A202C">Compliance Calendar bulanan &amp; tahunan (Coretax DJP)</text>

  <rect x="700" y="372" width="6" height="6" rx="1" fill="#D4A017"/>
  <text x="716" y="381" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A202C">Matriks risiko pajak &amp; sanksi administratif / pidana</text>

  <rect x="700" y="402" width="6" height="6" rx="1" fill="#D4A017"/>
  <text x="716" y="411" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1A202C">Action plan tax management pre-operasional hingga tahunan</text>

  <!-- Key Assumptions Box -->
  <rect x="40" y="460" width="1200" height="80" rx="6" fill="#1B3A6B" fill-opacity="0.06" stroke="#1B3A6B" stroke-width="1" stroke-opacity="0.2"/>
  <text x="60" y="488" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B3A6B">Asumsi Utama  |</text>
  <text x="185" y="488" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4A5568">Entitas berbadan hukum (PT/CV/Koperasi)  •  Tahun fiskal Januari – Desember 2026  •  Satu SPPG dengan 3.000 porsi/hari</text>
  <text x="60" y="516" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4A5568">Pembayaran diterima via Yayasan Mitra  •  Berlaku UU HPP (UU 7/2021), PMK 168/2023 TER, PMK 81/2024 Coretax  •  Perda lokal bervariasi</text>

  <!-- Disclaimer note -->
  <rect x="40" y="555" width="1200" height="50" rx="4" fill="#FFF5F5" stroke="#C53030" stroke-width="1" stroke-opacity="0.4"/>
  <text x="60" y="576" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#C53030">PERNYATAAN PROFESIONAL:</text>
  <text x="220" y="576" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Dokumen ini untuk tujuan analisis tax planning awal. Bukan opini pajak formal atau tax ruling. Setiap implementasi</text>
  <text x="60" y="596" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">harus didahului oleh tax due diligence oleh Konsultan Pajak Bersertifikat (Brevet C / USKP) dan tax ruling tertulis dari KPP.</text>

  <!-- Footer -->
  <rect x="0" y="693" width="1280" height="27" fill="#1B3A6B"/>
  <text x="640" y="710" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#A8C4E8">Analisis Pajak &amp; Tax Management MBG 2026  –  Confidential Tax Planning</text>
  <text x="1250" y="710" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#D4A017">2 / 15</text>
</svg>
