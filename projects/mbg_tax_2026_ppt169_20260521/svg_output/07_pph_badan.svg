<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="65" fill="#1B3A6B"/>
  <rect x="0" y="65" width="6" height="628" fill="#D4A017"/>

  <text x="40" y="43" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">PPh BADAN – CORPORATE INCOME TAX</text>
  <text x="1240" y="43" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#A8C4E8">Tarif 22% | Base Case</text>

  <!-- Left: Calculation waterfall -->
  <rect x="20" y="78" width="600" height="34" rx="4" fill="#2C5282"/>
  <text x="320" y="100" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Perhitungan PPh Badan – Base Case</text>

  <!-- Waterfall calculation -->
  <rect x="20" y="112" width="600" height="430" rx="4" fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1"/>

  <!-- EBT -->
  <rect x="30" y="122" width="580" height="32" rx="3" fill="#1B3A6B"/>
  <text x="42" y="142" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Laba Akuntansi sebelum Pajak (EBT)</text>
  <text x="590" y="142" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#D4A017">Rp 578.000.000</text>

  <!-- Koreksi Fiskal label -->
  <text x="42" y="172" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#2C5282">KOREKSI FISKAL (+) Non-Deductible:</text>

  <text x="55" y="194" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Sumbangan non-PMK 76/2011</text>
  <text x="590" y="194" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#C53030">+ Rp 8.000.000</text>
  <line x1="42" y1="200" x2="595" y2="200" stroke="#CBD5E0" stroke-width="1"/>

  <text x="55" y="216" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Sanksi pajak</text>
  <text x="590" y="216" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#C53030">+ Rp 3.000.000</text>
  <line x1="42" y1="222" x2="595" y2="222" stroke="#CBD5E0" stroke-width="1"/>

  <text x="55" y="238" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Natura non-objek (PMK 66/2023)</text>
  <text x="590" y="238" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#C53030">+ Rp 15.000.000</text>
  <line x1="42" y1="244" x2="595" y2="244" stroke="#CBD5E0" stroke-width="1"/>

  <text x="55" y="260" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Cadangan piutang berlebih</text>
  <text x="590" y="260" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#C53030">+ Rp 5.000.000</text>

  <text x="42" y="284" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#276749">KOREKSI FISKAL (–) Non-Objek:</text>
  <text x="55" y="300" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Bunga deposito (PPh Final)</text>
  <text x="590" y="300" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#276749">– Rp 2.000.000</text>

  <line x1="42" y1="310" x2="595" y2="310" stroke="#2C5282" stroke-width="1.5"/>

  <!-- PKP -->
  <rect x="30" y="316" width="580" height="32" rx="3" fill="#2C5282"/>
  <text x="42" y="336" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Penghasilan Kena Pajak (PKP)</text>
  <text x="590" y="336" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#D4A017">Rp 607.000.000</text>

  <!-- PPh Terutang -->
  <text x="42" y="370" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">PPh Badan Terutang (22% × PKP)</text>
  <text x="590" y="370" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#1B3A6B">Rp 133.540.000</text>

  <!-- Kredit Pajak -->
  <text x="42" y="396" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#276749">KREDIT PAJAK (Prepayment):</text>
  <text x="55" y="416" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">PPh 23 dipotong Yayasan</text>
  <text x="590" y="416" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#276749">– Rp 281.700.000</text>
  <line x1="42" y1="422" x2="595" y2="422" stroke="#CBD5E0" stroke-width="1"/>

  <text x="55" y="438" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">PPh 25 angsuran bulanan</text>
  <text x="590" y="438" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#276749">– Rp 11.130.000</text>

  <line x1="42" y1="450" x2="595" y2="450" stroke="#2C5282" stroke-width="1.5"/>

  <!-- PPh 29 Lebih Bayar -->
  <rect x="30" y="456" width="580" height="74" rx="3" fill="#E6FFF0" stroke="#276749" stroke-width="1.5"/>
  <text x="42" y="478" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#276749">PPh Pasal 29: LEBIH BAYAR</text>
  <text x="590" y="478" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#276749">(Rp 159.290.000)</text>
  <text x="42" y="500" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A5568">PPh 23 dipotong (Rp 281,7 jt) + PPh 25 (Rp 11,1 jt)</text>
  <text x="42" y="518" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A5568">melebihi PPh Badan terutang (Rp 133,5 jt) → lebih bayar Rp 159 jt</text>

  <!-- Right side: Key insights -->
  <rect x="645" y="78" width="615" height="34" rx="4" fill="#C53030"/>
  <text x="952" y="100" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">INSIGHT KRITIS – DUAL ETR &amp; CASH TRAP</text>

  <!-- ETR comparison -->
  <rect x="645" y="122" width="295" height="110" rx="6" fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1"/>
  <text x="792" y="150" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Statutory Tax Rate</text>
  <text x="792" y="195" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="800" fill="#1B3A6B">22%</text>
  <text x="792" y="222" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A5568">PPh Badan Normal</text>

  <rect x="965" y="122" width="295" height="110" rx="6" fill="#1B3A6B" stroke="#1B3A6B" stroke-width="1"/>
  <text x="1112" y="150" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#A8C4E8">Cash ETR</text>
  <text x="1112" y="195" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="800" fill="#D4A017">52,2%</text>
  <text x="1112" y="222" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#A8C4E8">Karena PPh 23 prepayment besar</text>

  <!-- ETR explanation -->
  <rect x="645" y="246" width="615" height="72" rx="5" fill="#FFF5F5" stroke="#C53030" stroke-width="1"/>
  <rect x="645" y="246" width="5" height="72" fill="#C53030"/>
  <text x="660" y="268" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#C53030">Cash Trap PPh 23:</text>
  <text x="760" y="268" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">PPh 23 Rp 281,7 jt dihitung atas omzet bruto</text>
  <text x="660" y="286" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">sedangkan PPh Badan hanya Rp 133,5 jt atas laba bersih.</text>
  <text x="660" y="304" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Mitra SPPG mengalami cash trap Rp 159 jt yang menunggu restitusi 12–24 bulan.</text>

  <!-- Working capital note -->
  <rect x="645" y="330" width="615" height="55" rx="5" fill="#FFFBEB" stroke="#D4A017" stroke-width="1"/>
  <text x="660" y="352" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#D4A017">REKOMENDASI WORKING CAPITAL PAJAK:</text>
  <text x="660" y="370" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Siapkan cadangan likuiditas pajak setara Rp 200–300 juta untuk menutup cash gap</text>
  <text x="660" y="386" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">PPh 23 lebih bayar selama menunggu kompensasi/restitusi.</text>

  <!-- Why PPh Badan higher than UMKM -->
  <rect x="645" y="398" width="615" height="110" rx="5" fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1"/>
  <text x="952" y="422" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B3A6B">Mengapa Tidak Bisa PPh Final UMKM 0,5%?</text>
  <rect x="660" y="432" width="8" height="8" rx="2" fill="#C53030"/>
  <text x="676" y="442" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Omzet SPPG ~Rp 14,08 miliar &gt; batas Rp 4,8 miliar (PP 55/2022)</text>
  <rect x="660" y="452" width="8" height="8" rx="2" fill="#C53030"/>
  <text x="676" y="462" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">SPPG wajib PPh Badan normal 22% + pembukuan lengkap (akrual)</text>
  <rect x="660" y="472" width="8" height="8" rx="2" fill="#D4A017"/>
  <text x="676" y="482" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Wajib SPT Tahunan PPh Badan 1771 + lampiran L01–L05</text>
  <rect x="660" y="492" width="8" height="8" rx="2" fill="#276749"/>
  <text x="676" y="502" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Angsuran PPh 25 bulanan: 1/12 × PPh terutang tahun sebelumnya</text>

  <!-- Kompensasi vs Restitusi -->
  <rect x="645" y="522" width="295" height="94" rx="5" fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1"/>
  <text x="792" y="545" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#276749">Kompensasi (Pilih Ini)</text>
  <text x="660" y="564" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A5568">Otomatis kurangi PPh masa</text>
  <text x="660" y="580" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A5568">berikutnya tanpa pemeriksaan</text>
  <text x="660" y="596" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#276749">Cash kembali lebih cepat</text>
  <text x="660" y="608" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#4A5568">Pasal 31 UU KUP</text>

  <rect x="965" y="522" width="295" height="94" rx="5" fill="#FFF5F5" stroke="#C53030" stroke-width="1"/>
  <text x="1112" y="545" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#C53030">Restitusi (Hindari)</text>
  <text x="980" y="564" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A5568">Proses 12–24 bulan</text>
  <text x="980" y="580" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A5568">+ pemeriksaan DJP</text>
  <text x="980" y="596" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#C53030">Cash tertahan sangat lama</text>
  <text x="980" y="608" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#4A5568">Pasal 17B UU KUP</text>

  <rect x="0" y="693" width="1280" height="27" fill="#1B3A6B"/>
  <text x="640" y="710" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#A8C4E8">Analisis Pajak &amp; Tax Management MBG 2026  –  Confidential Tax Planning</text>
  <text x="1250" y="710" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#D4A017">7 / 15</text>
</svg>
