  <text x="760" y="268" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">PPh 23 Rp 281,7 jt dihitung atas omzet bruto</text>
  <text x="660" y="286" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">sedangkan PPh Badan hanya Rp 133,5 jt atas laba bersih.</text>
  <text x="660" y="304" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Mitra SPPG mengalami cash trap Rp 159 jt yang menunggu restitusi 12–24 bulan.</text>

  
