  <text x="660" y="370" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Siapkan cadangan likuiditas pajak setara Rp 200–300 juta untuk menutup cash gap</text>
  <text x="660" y="386" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">PPh 23 lebih bayar selama menunggu kompensasi/restitusi.</text>

  
