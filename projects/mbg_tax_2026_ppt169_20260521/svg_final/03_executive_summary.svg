  <text x="64" y="608" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">7</text>
  <text x="86" y="601" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B3A6B">Effective Tax Rate (ETR) Estimasi 28–32%</text>
  <text x="86" y="620" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Lebih tinggi dari tarif statutory 22% karena PBJT non-creditable,</text>
  <text x="86" y="638" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">PPh 23 sebagai prepayment, dan beberapa biaya non-deductible.</text>

  
  
