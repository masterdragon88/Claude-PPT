  <rect x="0" y="65" width="6" height="628" fill="#D4A017" />

  
  <text x="40" y="43" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">EXECUTIVE SUMMARY – TAX POSITION</text>
  <text x="1240" y="43" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#A8C4E8">7 Poin Kunci</text>

  
  <text x="40" y="95" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4A5568">Bisnis SPPG MBG menghadapi kompleksitas pajak multi-layer. Setiap rupiah pagu MBG akan mengalami minimal 2–3 lapis pemajakan.</text>

  
  
  <path fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1" d="M45,112 H635 A5,5 0 0 1 640,117 V175 A5,5 0 0 1 635,180 H45 A5,5 0 0 1 40,175 V117 A5,5 0 0 1 45,112 Z" />
  <rect x="40" y="112" width="5" height="68" fill="#1B3A6B" />
  <path fill="#1B3A6B" d="M64,124 H64 A12,12 0 0 1 76,136 V136 A12,12 0 0 1 64,148 H64 A12,12 0 0 1 52,136 V136 A12,12 0 0 1 64,124 Z" />
  <text x="64" y="140" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
  <text x="86" y="133" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B3A6B">Rezim PPh Badan Reguler 22%</text>
  <text x="86" y="152" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Omzet ~Rp 14 M/tahun melebihi batas PPh Final UMKM 0,5% (PP 55/2022).</text>
  <text x="86" y="170" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Wajib PPh Badan normal 22% + pembukuan lengkap.</text>

  
  <path fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1" d="M45,190 H635 A5,5 0 0 1 640,195 V253 A5,5 0 0 1 635,258 H45 A5,5 0 0 1 40,253 V195 A5,5 0 0 1 45,190 Z" />
  <rect x="40" y="190" width="5" height="68" fill="#1B3A6B" />
  <path fill="#1B3A6B" d="M64,202 H64 A12,12 0 0 1 76,214 V214 A12,12 0 0 1 64,226 H64 A12,12 0 0 1 52,214 V214 A12,12 0 0 1 64,202 Z" />
  <text x="64" y="218" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
  <text x="86" y="211" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B3A6B">PPN Dikecualikan – PBJT Berlaku</text>
  <text x="86" y="230" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Jasa boga/katering TIDAK dikenai PPN (PMK 70/PMK.03/2022).</text>
  <text x="86" y="248" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#C53030">Namun PBJT daerah max 10% (UU 1/2022 HKPD) — tergantung Perda.</text>

  
  <path fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1" d="M45,268 H635 A5,5 0 0 1 640,273 V331 A5,5 0 0 1 635,336 H45 A5,5 0 0 1 40,331 V273 A5,5 0 0 1 45,268 Z" />
  <rect x="40" y="268" width="5" height="68" fill="#1B3A6B" />
  <path fill="#1B3A6B" d="M64,280 H64 A12,12 0 0 1 76,292 V292 A12,12 0 0 1 64,304 H64 A12,12 0 0 1 52,292 V292 A12,12 0 0 1 64,280 Z" />
  <text x="64" y="296" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
  <text x="86" y="289" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B3A6B">Withholding PPh 23 — 2% atas Bruto</text>
  <text x="86" y="308" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Pembayaran dari BGN/Yayasan ke SPPG dipotong 2% atas bruto jasa katering.</text>
  <text x="86" y="326" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">4% jika SPPG tidak punya NPWP. Total PPh 23 dipotong: Rp 281,7 juta/tahun.</text>

  
  <path fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1" d="M45,346 H635 A5,5 0 0 1 640,351 V409 A5,5 0 0 1 635,414 H45 A5,5 0 0 1 40,409 V351 A5,5 0 0 1 45,346 Z" />
  <rect x="40" y="346" width="5" height="68" fill="#1B3A6B" />
  <path fill="#1B3A6B" d="M64,358 H64 A12,12 0 0 1 76,370 V370 A12,12 0 0 1 64,382 H64 A12,12 0 0 1 52,370 V370 A12,12 0 0 1 64,358 Z" />
  <text x="64" y="374" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
  <text x="86" y="367" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B3A6B">PPh 21 TER untuk 47 Karyawan</text>
  <text x="86" y="386" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Skema TER (PMK 168/2023): tarif efektif rata-rata Jan–Nov, rekonsiliasi</text>
  <text x="86" y="404" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">progresif Pasal 17 di Desember. Estimasi total PPh 21: ~Rp 5,8 juta/tahun.</text>

  
  <path fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1" d="M45,424 H635 A5,5 0 0 1 640,429 V487 A5,5 0 0 1 635,492 H45 A5,5 0 0 1 40,487 V429 A5,5 0 0 1 45,424 Z" />
  <rect x="40" y="424" width="5" height="68" fill="#1B3A6B" />
  <path fill="#1B3A6B" d="M64,436 H64 A12,12 0 0 1 76,448 V448 A12,12 0 0 1 64,460 H64 A12,12 0 0 1 52,448 V448 A12,12 0 0 1 64,436 Z" />
  <text x="64" y="452" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
  <text x="86" y="445" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1B3A6B">BPHTB Saat Akuisisi Lahan</text>
  <text x="86" y="464" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">5% × (NPOP – NPOPTKP) = ~Rp 51 juta untuk lahan Rp 1,1 miliar.</text>
  <text x="86" y="482" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4A5568">Bersifat once-off namun signifikan untuk cash flow tahun pertama.</text>

  
  <path fill="#EEF2F8" stroke="#CBD5E0" stroke-width="1" d="M45,502 H635 A5,5 0 0 1 640,507 V565 A5,5 0 0 1 635,570 H45 A5,5 0 0 1 40,565 V507 A5,5 0 0 1 45,502 Z" />
  <rect x="40" y="502" width="5" height="68" fill="#1B3A6B" />
